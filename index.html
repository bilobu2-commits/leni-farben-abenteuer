<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leni's Farben-Abenteuer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f4f1ea;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #hud {
        position: relative;
        width: 960px;
        text-align: center;
      }
      #title-image {
        display: block;
        margin: 4px auto 0;
        height: 150px;
        width: auto;
      }
      #level-label {
        margin-bottom: 8px;
        font-size: 26px;
        font-weight: bold;
        color: #555555;
      }
      #mute-button {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #999999;
        background: #ffffff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #mute-button:hover {
        background: #f0f0f0;
      }
      #mute-button .icon-muted {
        display: none;
      }
      #mute-button.muted .icon-unmuted {
        display: none;
      }
      #mute-button.muted .icon-muted {
        display: block;
      }
      #game {
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
      }
      #score {
        width: 960px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .score-icon {
        width: 30px;
        height: 30px;
        background-color: #d8d4c8;
        -webkit-mask-image: url("/sprites/monster.png");
        mask-image: url("/sprites/monster.png");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .score-icon.filled {
        animation: icon-pop 0.22s ease-out;
      }
      .score-icon-reference {
        width: 38px;
        height: 38px;
        padding-right: 12px;
        margin-right: 4px;
        border-right: 2px dashed #c9c2b0;
      }
      @keyframes icon-pop {
        0% {
          transform: scale(1.6);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <button id="mute-button" type="button" aria-label="Ton ein- und ausschalten">
          <svg class="icon-unmuted" viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#333333" />
            <path d="M16 9c1.2 1.2 1.2 4.8 0 6" stroke="#333333" stroke-width="1.6" fill="none" stroke-linecap="round" />
            <path d="M18.5 6.5c2.4 2.4 2.4 8.6 0 11" stroke="#333333" stroke-width="1.6" fill="none" stroke-linecap="round" />
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#333333" />
            <line x1="15" y1="7" x2="22" y2="17" stroke="#c0392b" stroke-width="2" stroke-linecap="round" />
            <line x1="22" y1="7" x2="15" y2="17" stroke="#c0392b" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <img id="title-image" src="/sprites/ueberschrift.png" alt="Leni's Farben-Abenteuer" />
        <div id="level-label"></div>
      </div>
      <div id="game"></div>
      <div id="score"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
